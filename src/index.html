<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Terera'a</title>
    <base href="/" />
    <!-- viewport-fit=cover : indispensable pour que env(safe-area-inset-*) soit
         renseigné en standalone sur iPhone à encoche / Dynamic Island. -->
    <!-- maximum-scale / user-scalable : pas de zoom pinch (Android). iOS l'ignore,
         d'où le blocage des événements gesture* ci-dessous. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Boîte à outils hors ligne pour un voyage en Polynésie française." />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />

    <!-- Installation sur l'écran d'accueil iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terera'a" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <ta-root></ta-root>
    <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
      <script>
      // iOS Safari ignore user-scalable=no : on bloque le pinch à la source.
      for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
        document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
      }
    </script>
  </body>
</html>
